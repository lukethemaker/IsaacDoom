// IsaacDoom boot config - exec'd from the launcher (user-side, so "exec" is allowed).
alias isaac_loop "exec isaac_in.cfg; wait 1; isaac_loop"
bind scroll "exec isaac_in.cfg"
// the engine's bindings are shared with every other mod you launch through it (your
// LTTP/Pokemon bridge rebinds Mouse1 to +poke_fire): claim what IsaacDoom needs each boot
bind mouse1 "+attack"
bind space "netevent isaac_use"
bind q "netevent isaac_card"
// bombs go through a netevent so they work while the fire button is held
bind e "netevent isaac_bomb"
unbind mouse2
bind r "netevent isaac_restart"
// Isaac's drop button: tap to swap (Schoolbag, The Forgotten), hold to drop trinkets / pocket items
alias +isaac_drop "netevent isaac_dropdown"
alias -isaac_drop "netevent isaac_dropup"
bind ctrl "+isaac_drop"
bind tab "netevent isaac_map"
alias isaac_gun "toggle r_drawplayersprites"
r_drawplayersprites 0
bind g "isaac_gun"
freelook true
autoaim 0
crosshair 1
cl_run 1
// no sprint / walk modifier: Doomguy always moves at Isaac's own speed stat
unbind shift
unbind lshift
unbind rshift
con_notifylines 0
// no Doom status bar: Isaac's HUD replaces it ("screenblocks 10" brings it back)
screenblocks 12
// rocks fill their cell like in Isaac
isaac_gridscale 2.0
isaac_scale 1.6
hud_scale 0
echo IsaacDoom boot cfg loaded
isaac_loop
