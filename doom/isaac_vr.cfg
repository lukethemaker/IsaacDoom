// IsaacDoom - extra settings for the VR build (exec'd after isaac_boot.cfg)
vr_mode 10                 // OpenVR / SteamVR
vr_hud_scale 0.6           // Isaac HUD, VS screens and stage cards on the floating panel
vr_hud_distance 1.0
vr_hud_stereo 0
// pull the Isaac HUD in from the corners of the floating panel
isaac_hudinset 0.14
isaac_mapinset 16
vr_enable_haptics 1
vr_crouch_use_button 0
// aim: shots go where the head looks (Isaac's 8-way aim is driven by the player's facing)
vr_move_use_offhand 1
freelook true
screenblocks 12
// Quest / Touch controllers (SteamVR exposes them as a gamepad to Doom): A = active item
// (Space), B = card / pill / pocket active (Q), X = bomb (E), Y = drop (Ctrl), left grip = map.
// If a button does nothing, open Options > Customize Controls in the headset, pick the action
// and press the button: the name Doom prints is the one to put in the bind below.
bind pad_a "netevent isaac_use"
bind pad_b "netevent isaac_card"
bind pad_x "netevent isaac_bomb"
bind pad_y "+isaac_drop"
bind pad_lshoulder "netevent isaac_map"
bind pad_rthumb "netevent isaac_use"
